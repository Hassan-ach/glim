<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT-Summarize - Configuration</title>
    <link rel="stylesheet" href="options.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Configuration</h1>
            <p>Configure your extension settings</p>
        </div>
        <div class="content">
            <div id="statusMessage" class="status-message"></div>

            <form id="configForm">
                <div class="section">
                    <div class="section-title">API Settings</div>
                    
                    <!-- <div class="form-group"> -->
                    <!--     <label for="apiProvider">Provider</label> -->
                    <!--     <select id="apiProvider" name="api.provider"> -->
                    <!--         <option value="google">Google (Gemini)</option> -->
                    <!--     </select> -->
                    <!-- </div> -->

                    <div class="form-group">
                        <label for="apiKey">API Key</label>
                        <input type="text" id="apiKey" name="api.key" placeholder="Enter your API key(gemini)">
                        <div class="help-text">Your API key for the selected provider</div>
                    </div>

                <!--     <div class="form-group"> -->
                <!--         <label for="apiModel">Model</label> -->
                <!--         <input type="text" id="apiModel" name="api.model" placeholder="e.g., gemini-2.0-flash"> -->
                <!--     </div> -->
                <!-- </div> -->

                <div class="section">
                    <div class="section-title">Content Settings</div>
                    
                    <div class="row">
                        <div class="form-group">
                            <label for="maxTopics">Max Topics</label>
                            <input type="number" id="maxTopics" name="content.maxTopics" min="1" max="20" value="5">
                        </div>

                        <div class="form-group">
                            <label for="maxQuestionsPerTopic">Max Questions</label>
                            <input type="number" id="maxQuestionsPerTopic" name="content.maxQuestionsPerTopic" min="1" max="10" value="3">
                        </div>
                    </div>

                    <div class="row">
                        <div class="form-group">
                            <label for="codeLang">Language</label>
                            <input type="text" id="codeLang" name="content.codeLang" placeholder="en" value="en">
                        </div>

                        <div class="form-group">
                            <label for="theme">Theme</label>
                            <input type="text" id="theme" name="content.theme" placeholder="default, neomorphism, glassmorphism, retroY2K, hacker, typography, maximalist, brutalist, flat, minimalist, material" value="default">
                        </div>
                    </div>
                </div>

                <div class="button-group">
                    <button type="button" id="resetBtn">Reset</button>
                    <button type="submit" class="btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="options.js"></script>
</body>
</html>
